name: Floorer CI & Release

env:
  project_url: 'https://github.com/${{ github.repository }}'
  latest_manifest_url: 'https://raw.githubusercontent.com/${{ github.repository }}/main/module.json'
  release_module_url: 'https://github.com/${{ github.repository }}/releases/download/${{ github.event.release.tag_name }}/floorer.zip'

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to publish to Foundry (for example v1.2.2)'
        required: true
        type: string
      dry_run:
        description: 'Ask Foundry to validate only, without publishing'
        required: false
        type: boolean
        default: false

jobs:
  test:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: npm
      - run: npm ci
        env:
          NPM_CONFIG_AUDIT: false
      - run: npm run lint
      - run: npm test

  build:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    needs: [test]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Validate module manifest
        run: jq empty module.json

      - name: Extract version from tag
        id: get_version
        if: github.event_name == 'release'
        uses: battila7/get-version-action@v2

      - name: Stamp manifest with release values
        if: github.event_name == 'release'
        run: |
          jq --arg v "${{ steps.get_version.outputs.version-without-v }}" \
             --arg url "${{ env.project_url }}" \
             --arg manifest "${{ env.latest_manifest_url }}" \
             --arg download "${{ env.release_module_url }}" \
             '.version = $v | .url = $url | .manifest = $manifest | .download = $download' \
             module.json > module.tmp.json && mv module.tmp.json module.json
          jq '{id, version, manifest, download}' module.json

      - name: Create module archive
        if: github.event_name == 'release'
        run: zip --recurse-paths ./floorer.zip module.json README.md CHANGELOG.md LICENSE scripts/ styles/ templates/ lang/

      - name: Attach files to the release
        if: github.event_name == 'release'
        uses: ncipollo/release-action@v1
        with:
          allowUpdates: true
          name: ${{ github.event.release.name }}
          draft: ${{ github.event.release.unpublished }}
          prerelease: ${{ github.event.release.prerelease }}
          token: ${{ secrets.GITHUB_TOKEN }}
          artifacts: './module.json, ./floorer.zip'
          tag: ${{ github.event.release.tag_name }}
          body: ${{ github.event.release.body }}

  publish-to-foundry:
    runs-on: ubuntu-latest
    needs: [build]
    if: ${{ always() && (((github.event_name == 'release' && github.event.release.prerelease != true) && needs.build.result == 'success') || github.event_name == 'workflow_dispatch') }}
    permissions:
      actions: read
      contents: read
    steps:
      - name: Check The Release Exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.event.release.tag_name }}
        run: |
          gh release view "$TAG" --repo "${{ github.repository }}" --json assets --jq '.assets[].name' | grep -qx module.json \
            || { echo "::error::Release $TAG has no module.json asset; publish it on GitHub first."; exit 1; }

      # Foundry revokes the API key when a package publishes too often: at most one release per 24 hours.
      - name: Allow One Foundry Release Per 24 Hours
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.event.release.tag_name }}
        run: |
          since=$(date -u -d '24 hours ago' +%s)
          gh api "repos/${{ github.repository }}/actions/workflows/main.yml/runs?per_page=100" \
            --jq '.workflow_runs[] | select(.id != ${{ github.run_id }}) | "\(.id) \(.created_at)"' |
          while read -r id created; do
            [ "$(date -u -d "$created" +%s)" -lt "$since" ] && continue
            published=$(gh api "repos/${{ github.repository }}/actions/runs/$id/jobs" \
              --jq '[.jobs[] | select(.name == "publish-to-foundry" and .conclusion == "success")] | length')
            if [ "$published" -gt 0 ]; then
              echo "::error::Foundry already received a release from run $id at $created (within 24 hours). $TAG stays on GitHub only; its update link works. Publish it later with Run workflow (Publish to Foundry)."
              exit 1
            fi
          done

      - name: Publish to Foundry VTT
        uses: JamesIves/fetch-api-data-action@v2
        with:
          endpoint: https://foundryvtt.com/_api/packages/release_version/
          configuration: '{ "method": "POST", "headers": { "Content-Type": "application/json", "Authorization": "${{ secrets.FVTT_API_TOKEN }}" }, "body": { "id": "floorer", "dry-run": ${{ github.event_name == ''workflow_dispatch'' && inputs.dry_run || false }}, "release": { "version": "${{ github.event_name == ''workflow_dispatch'' && inputs.tag || github.event.release.tag_name }}", "manifest": "https://github.com/${{ github.repository }}/releases/download/${{ github.event_name == ''workflow_dispatch'' && inputs.tag || github.event.release.tag_name }}/module.json", "notes": "https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md", "compatibility": { "minimum": "14", "verified": "14", "maximum": "14" } } } }'
